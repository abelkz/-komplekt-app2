name: komplekt
description: "КОМПЛЕКТ — маркетплейс отделочных и строительных материалов (Астана, Казахстан/СНГ)."
publish_to: "none"
# Номер версии для сторов. Берётся сборкой из этого файла — в codemagic.yaml
# он больше не продублирован, чтобы не расходился с репозиторием.
# 1.0.0 — первый релиз в App Store (сентябрь 2026).
# 1.0.1 — гостевой каталог, таймауты, мониторинг.
version: 1.0.1+1

environment:
  # Нижние границы подняты под firebase_messaging 16.x (см. ниже): он требует
  # Dart ^3.6.0 и Flutter >=3.27.0.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Локализация (русский + задел под казахский) ──
  flutter_localizations:
    sdk: flutter

  # ── State management ──
  flutter_riverpod: ^2.5.1

  # ── Навигация ──
  go_router: ^14.2.7

  # ── Backend: Supabase (Postgres + PostGIS, Auth, Storage, Realtime) ──
  supabase_flutter: ^2.5.6

  # ── Карта: бесплатная, без ключей (OpenStreetMap) ──
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^12.0.0          # геолокация «поставщики рядом»

  # ── Конфигурация (никаких ключей в коде) ──
  flutter_dotenv: ^5.1.0

  # ── Локальное хранилище (тема, город, недавние поиски) ──
  shared_preferences: ^2.3.2

  # ── Отчёты о падениях в продакшене ──
  # Без SENTRY_DSN в .env не отправляет ничего и не мешает работе.
  # Ветка 8.x не собирается нынешним тулчейном: на iOS её Swift-плагин
  # не сходится с актуальной sentry-cocoa, на Android Kotlin-модуль
  # требует language version 1.6, которую компилятор больше не принимает.
  sentry_flutter: ^9.30.0

  # ── Пуш-уведомления (FCM) о снижении цены ──
  # Версии подняты 20.09.2026 не ради свежести, а ради одной починки.
  # На 15.2.10 iOS не выдавала APNs-токен вообще: плагин запускает
  # registerForRemoteNotifications из обработчика
  # UIApplicationDidFinishLaunchingNotification, а нынешний шаблон Flutter
  # генерирует приложение на UIScene и регистрирует плагины позже — в
  # didInitializeImplicitFlutterEngine. К тому моменту уведомление уже
  # прошло, обработчик не срабатывал, регистрация в APNs не запускалась
  # никогда, и всё это молча: getAPNSToken() возвращал null без ошибки.
  # В 16.7.0 авторы закрыли ровно это — «register for APNs when UIScene
  # plugins miss launch callbacks» и «register for APNs after Dart
  # Firebase.initializeApp()». Второе тоже про нас: конфиг мы передаём
  # из Dart, нативного GoogleService-Info.plist в сборке нет (§6.4).
  # firebase_messaging 16.7.0 требует firebase_core ^4.14.0.
  firebase_core: ^4.14.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^17.2.3

  # ── UI / медиа ──
  google_fonts: ^6.2.1          # Manrope + Unbounded из прототипа
  cached_network_image: ^3.3.1  # фото товаров с кэшем
  flutter_staggered_grid_view: ^0.7.0  # Pinterest-masonry лента вдохновения
  shimmer: ^3.0.0               # скелетоны для loading-состояний

  # ── Связь с продавцом (звонок / WhatsApp / сайт) ──
  url_launcher: ^6.3.0

  # ── Вход через Apple (нативная кнопка на iOS, требование App Store) ──
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3

  # ── HTTP: геокодер адреса поставщика (Nominatim/OpenStreetMap) ──
  http: ^1.2.2

  # ── Экспорт спецификации подборки ──
  pdf: ^3.11.1            # генерация PDF
  printing: ^5.13.2       # шрифты с кириллицей + системный «Поделиться» для PDF
  excel: ^4.0.6           # генерация и чтение .xlsx (импорт прайса)
  archive: ^3.6.1         # свой разбор .xlsx: пакет excel падает на части файлов
  xml: ^6.5.0             # (см. lib/features/supplier_cabinet/data/xlsx_reader.dart)
  file_picker: ^8.1.2     # выбор файла прайса
  image_picker: ^1.1.2    # фото товара из галереи/камеры
  share_plus: ^10.0.2     # отправка файла (Excel) в другие приложения
  path_provider: ^2.1.4   # временная папка для файла перед отправкой
  universal_io: ^2.2.2    # dart:io-совместимый API, компилируется и под веб

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1   # иконки из brand/logo.png (см. ниже)

# Иконка приложения на всех платформах.
# Генерируется в CI командой `dart run flutter_launcher_icons` — папки
# android/ios/web создаются при сборке, поэтому иконки тоже делаются там.
# Шаг пропускается, если brand/logo.png ещё не положили в репозиторий.
flutter_launcher_icons:
  image_path: "brand/logo.png"
  android: true
  ios: true
  remove_alpha_ios: true            # App Store не принимает прозрачность
  web:
    generate: true
    background_color: "#161410"
    theme_color: "#f2b800"

flutter:
  uses-material-design: true
  generate: true # генерация локализаций из lib/l10n/*.arb (flutter gen-l10n)

  # Файл с ключами окружения (см. .env.example)
  assets:
    - .env

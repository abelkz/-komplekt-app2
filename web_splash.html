<!-- Заставка на время загрузки веб-версии.
     Папка web/ генерируется при сборке, поэтому этот кусок вшивается
     в web/index.html скриптом tool/inject_splash.py прямо в CI.
     Без заставки Safari показывает пустой чёрный экран несколько секунд. -->
<style>
  #k-splash {
    position: fixed; inset: 0; z-index: 9999;
    background: #161410; color: #eae5da;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 44px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    transition: opacity .35s ease;
  }
  #k-splash.gone { opacity: 0; pointer-events: none; }
  #k-splash .mark { font-size: 78px; font-weight: 800; letter-spacing: -4px; line-height: 1; }
  #k-splash .mark i {
    display: inline-block; width: 78px; height: 14px;
    background: #f2b800; vertical-align: middle; margin-left: 6px;
  }
  /* фирменный знак, если в репозитории лежит brand/logo.png */
  #k-splash .logo { width: 96px; height: 96px; display: block; }
  #k-splash h1 { font-size: 30px; font-weight: 800; letter-spacing: -1px; margin: 26px 0 10px; }
  #k-splash p { font-size: 14px; line-height: 1.5; color: rgba(234,229,218,.55); margin: 0; }
  /* лента-рулетка с делениями и бегунком, как в телеграм-версии */
  #k-splash .bar {
    position: relative; height: 16px; margin-top: 52px; overflow: hidden;
    background: repeating-linear-gradient(90deg,
      rgba(234,229,218,.25) 0 1px, transparent 1px 9px);
  }
  #k-splash .bar b {
    position: absolute; top: 0; bottom: 0; width: 38%; background: #f2b800;
    animation: k-run 1.5s ease-in-out infinite alternate;
  }
  @keyframes k-run { from { left: 0; } to { left: 62%; } }
  #k-splash .cap {
    margin-top: 10px; font-size: 11px; letter-spacing: 2px;
    text-transform: uppercase; color: rgba(234,229,218,.45);
  }
</style>
<div id="k-splash">
  <!-- если есть brand/logo.png, скрипт сборки заменит этот знак на картинку -->
  <div class="mark" id="k-mark">К<i></i></div>
  <h1>КОМПЛЕКТ</h1>
  <p>Спецификация цен на материалы.<br>Поставщики · Казахстан · живые прайсы</p>
  <div class="bar"><b></b></div>
  <div class="cap">загрузка прайсов</div>
</div>
<script>
  // Flutter сообщает о первом отрисованном кадре — тогда и убираем заставку
  window.addEventListener('flutter-first-frame', function () {
    var s = document.getElementById('k-splash');
    if (!s) return;
    s.classList.add('gone');
    setTimeout(function () { s.remove(); }, 400);
  });
</script>

name: CI & Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare .env
        # Есть секреты Supabase — собираем APK с реальной базой,
        # нет — остаёмся в демо-режиме, чтобы сборка не падала.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            {
              echo "SUPABASE_URL=$SUPABASE_URL"
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
              echo "DEMO_MODE=false"
              echo "DEFAULT_CITY=Астана"
              echo "DEFAULT_LAT=51.1280"
              echo "DEFAULT_LNG=71.4304"
            } > .env
            echo "→ собран .env с реальной базой"
          else
            cp .env.example .env
            echo "→ секреты не заданы, демо-режим"
          fi

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Patch Android manifest (возврат после входа Google/Apple)
        run: |
          python3 - <<'PY'
          path = 'android/app/src/main/AndroidManifest.xml'
          xml = open(path, encoding='utf-8').read()
          if 'login-callback' not in xml:
              block = (
                  '        <intent-filter>\n'
                  '            <action android:name="android.intent.action.VIEW" />\n'
                  '            <category android:name="android.intent.category.DEFAULT" />\n'
                  '            <category android:name="android.intent.category.BROWSABLE" />\n'
                  '            <data android:scheme="kz.komplekt.app" android:host="login-callback" />\n'
                  '        </intent-filter>\n'
              )
              xml = xml.replace('</activity>', block + '        </activity>', 1)
              open(path, 'w', encoding='utf-8').write(xml)
              print('→ intent-filter добавлен')
          PY

      - name: Patch Android config
        run: |
          F=android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$F"
          sed -i -E '/^[[:space:]]*compileSdk[[:space:]]*=/ s/=.*/= 36/' "$F"
          sed -i -E '/^[[:space:]]*minSdk[[:space:]]*=/ s/=.*/= 23/' "$F"
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$F"
          G=android/build.gradle.kts
          { printf 'subprojects {\n    afterEvaluate {\n        val a = extensions.findByName("android")\n        if (a is com.android.build.gradle.BaseExtension) { a.compileSdkVersion(36) }\n    }\n}\n\n'; cat "$G"; } > "$G.tmp" && mv "$G.tmp" "$G"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: komplekt-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

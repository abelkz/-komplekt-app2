name: Миграция базы

# ─────────────────────────────────────────────────────────────────────────
# Применяет один файл из supabase/migrations к живой базе.
#
# Зачем: раньше каждую миграцию приходилось открывать и вручную вставлять
# в SQL Editor. Теперь достаточно запустить этот workflow и выбрать файл.
#
# ЧТО НУЖНО НАСТРОИТЬ ОДИН РАЗ — достаточно ОДНОГО секрета:
#
#   Settings → Secrets and variables → Actions → New repository secret
#     имя:      SUPABASE_DB_PASSWORD
#     значение: пароль базы данных (тот, что задавали при создании проекта;
#               сбросить можно в Supabase → Connect → там же есть ссылка)
#
# Хост пулера и имя пользователя workflow соберёт сам из идентификатора
# проекта и региона — искать нужную строку подключения среди вкладок
# дашборда не нужно.
#
# Если по какой-то причине нужен нестандартный адрес, можно вместо этого
# задать секрет SUPABASE_DB_URL с полной строкой подключения — он имеет
# приоритет. Тогда берите строку через кнопку Connect → Direct, вариант,
# где хост содержит pooler.supabase.com и порт 5432.
#
# Идентификатор проекта и регион не секретны (ref виден в адресе API и
# в самом приложении). Если проект переедет, их можно переопределить
# переменными репозитория SUPABASE_PROJECT_REF и SUPABASE_REGION —
# Settings → Secrets and variables → Actions → вкладка Variables.
#
# Запуск: вкладка Actions → «Миграция базы» → Run workflow → имя файла,
# например 0024_app_events.sql
# ─────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      file:
        description: 'Имя файла из supabase/migrations (например 0024_app_events.sql)'
        required: true
        type: string

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить имя файла и его наличие
        # Имя приходит из поля ввода, поэтому передаём его через переменную
        # окружения, а не подставляем в строку команды: иначе кто угодно с
        # правом запускать workflow мог бы дописать туда произвольную команду.
        env:
          MIGRATION_FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail
          case "$MIGRATION_FILE" in
            */*|*..*|"")
              echo "::error::Нужно имя файла без путей, например 0024_app_events.sql"
              exit 1 ;;
            *.sql) ;;
            *)
              echo "::error::Ожидается файл .sql"
              exit 1 ;;
          esac

          if [ ! -f "supabase/migrations/$MIGRATION_FILE" ]; then
            echo "::error::Файла supabase/migrations/$MIGRATION_FILE нет. Доступные:"
            ls supabase/migrations
            exit 1
          fi
          echo "Будет применён: supabase/migrations/$MIGRATION_FILE"

      - name: Поставить клиент postgres, если его нет
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Применить миграцию
        # Всё в одном шаге намеренно: пароль и строка подключения не выходят
        # за его пределы и не попадают ни в GITHUB_ENV, ни в логи.
        env:
          MIGRATION_FILE: ${{ inputs.file }}
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          PROJECT_REGION: ${{ vars.SUPABASE_REGION }}
        run: |
          set -euo pipefail

          FILE="supabase/migrations/$MIGRATION_FILE"

          # Вариант 1: задана готовая строка подключения — используем как есть.
          # psql идёт одной транзакцией: при ошибке не остаётся наполовину
          # применённой миграции. Если когда-нибудь появится команда, которую
          # нельзя выполнить в транзакции (например CREATE INDEX CONCURRENTLY),
          # для неё этот флаг придётся убрать.
          if [ -n "${DB_URL:-}" ]; then
            echo "Подключение: по строке из секрета SUPABASE_DB_URL"
            psql "$DB_URL" \
              --single-transaction \
              --set ON_ERROR_STOP=1 \
              --file "$FILE"
            echo "### Миграция применена: \`$MIGRATION_FILE\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Вариант 2: задан только пароль — адрес собираем сами.
          if [ -z "${DB_PASSWORD:-}" ]; then
            echo "::error::Нужен секрет SUPABASE_DB_PASSWORD (или SUPABASE_DB_URL). См. комментарий вверху файла."
            exit 1
          fi
          echo "::add-mask::$DB_PASSWORD"

          REF="${PROJECT_REF:-xncupkiiuhpcsficvnbr}"
          REGION="${PROJECT_REGION:-ap-northeast-2}"

          # Подключаемся только через пулер: прямой хост db.<ref>.supabase.co
          # отвечает лишь по IPv6, которого у раннеров GitHub нет. Префикс
          # пулера у разных проектов отличается, поэтому перебираем известные
          # и берём первый, который отзывается.
          HOST=""
          for PREFIX in aws-0 aws-1; do
            CANDIDATE="$PREFIX-$REGION.pooler.supabase.com"
            set +e
            pg_isready -h "$CANDIDATE" -p 5432 -t 5 >/dev/null 2>&1
            RC=$?
            set -e
            # 0 — принимает соединения, 1 — отвечает, но отклоняет.
            # В обоих случаях хост существует и доступен.
            if [ "$RC" -eq 0 ] || [ "$RC" -eq 1 ]; then
              HOST="$CANDIDATE"
              break
            fi
          done

          if [ -z "$HOST" ]; then
            echo "::error::Не удалось найти адрес пулера для региона $REGION."
            echo "::error::Задайте переменную SUPABASE_REGION или секрет SUPABASE_DB_URL со строкой подключения."
            exit 1
          fi
          echo "Подключение: $HOST (пользователь postgres.$REF)"

          # Пароль передаём через PGPASSWORD, а не в составе URL: иначе его
          # пришлось бы URL-кодировать, и спецсимволы ломали бы подключение.
          PGPASSWORD="$DB_PASSWORD" psql \
            --host="$HOST" \
            --port=5432 \
            --username="postgres.$REF" \
            --dbname=postgres \
            --single-transaction \
            --set ON_ERROR_STOP=1 \
            --file "$FILE"

          echo "### Миграция применена: \`$MIGRATION_FILE\`" >> "$GITHUB_STEP_SUMMARY"

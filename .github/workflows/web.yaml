name: Build Web (превью интерфейса)

# Собирает приложение как сайт и публикует на GitHub Pages.
# Нужно, чтобы посмотреть интерфейс на iPhone/любом телефоне без Mac,
# Apple Developer и установки чего-либо. Запускается в демо-режиме
# (DEMO_MODE=true из .env.example) — на встроенных данных, без Supabase.

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare .env
        # Если в Secrets репозитория заданы ключи Supabase — собираем .env
        # с реальной базой. Если нет — остаёмся в демо-режиме, чтобы сборка
        # никогда не падала из-за отсутствия секретов.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            {
              echo "SUPABASE_URL=$SUPABASE_URL"
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
              echo "DEMO_MODE=false"
              echo "DEFAULT_CITY=Астана"
              echo "DEFAULT_LAT=51.1280"
              echo "DEFAULT_LNG=71.4304"
            } > .env
            echo "→ собран .env с реальной базой"
          else
            cp .env.example .env
            echo "→ секреты не заданы, демо-режим"
          fi

      - name: Generate web platform folder
        # web/ в репозитории не хранится — генерируем, как android/ и ios/
        run: flutter create . --platforms=web

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # base-href обязан совпадать с именем репозитория, иначе на Pages
        # не подгрузятся скрипты и будет белый экран.
        # BUILD_TAG виден внизу экрана «Профиль» — по нему сразу понятно,
        # открыта свежая версия или старая из кэша браузера.
        run: |
          flutter build web --release \
            --base-href "/-komplekt-app2/" \
            --dart-define=BUILD_TAG="${GITHUB_SHA::7}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

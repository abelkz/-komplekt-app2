name: Сборка для Google Play

# Собирает подписанный выпуск (.aab) — файл, который загружают в Google
# Play Console. Сам в магазин ничего не отправляет: первая загрузка в Play
# в любом случае делается руками (Google не даёт API-доступа приложению,
# у которого ещё нет ни одного выпуска), а дальше автозагрузку можно
# добавить отдельным шагом.
#
# КЛЮЧ ПОДПИСИ. Нужны секреты репозитория:
#   ANDROID_KEYSTORE_BASE64    — файл хранилища ключей в base64
#   ANDROID_KEYSTORE_PASSWORD  — пароль хранилища
#   ANDROID_KEY_ALIAS          — имя ключа (если не задано — upload)
#   ANDROID_KEY_PASSWORD       — пароль ключа (если не задан — как у хранилища)
#
# Без них сборка НЕ падает, а идёт ПРОБНОЙ: подписывается одноразовым
# ключом, созданным тут же. Такой файл в Play загружать нельзя, но он
# показывает главное — что выпуск вообще собирается: минификация, версии
# SDK, подпись. Иначе первой проверкой стал бы день публикации.
#
# Потерять ключ не страшно, но неприятно: при включённой «Подписи
# приложений Play» (она включается по умолчанию) это ключ ЗАГРУЗКИ, а не
# ключ приложения. Google меняет его по обращению в поддержку. А вот без
# доступа к аккаунту разработчика он бесполезен и постороннему.

on:
  workflow_dispatch:
  pull_request:
    # Проверяем выпуск, когда меняется то, что может его сломать.
    paths:
      - .github/workflows/play.yaml
      - tool/prepare_android.sh
      - pubspec.yaml
      - pubspec.lock

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      # Пароли и имя ключа одинаково нужны и шагу, который готовит
      # хранилище, и самому Gradle — он читает их из окружения.
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'probnyi-klyuch-ne-dlya-play' }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'upload' }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || 'probnyi-klyuch-ne-dlya-play' }}
    steps:
      - uses: actions/checkout@v4

      # Java 21, а не 17, как в ci.yaml. Выпуск, в отличие от отладочной
      # сборки, прогоняет lint (задача lintVitalAnalyzeRelease), а lint в
      # нынешнем Android-плагине собран под Java 21. На 17-й он падает с
      # «NoSuchMethodError: List.removeLast()» — причём на чужом плагине
      # (firebase_core), так что по тексту ошибки причину не угадать.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare .env
        # В магазин идёт только сборка с настоящей базой. Демо-режим в
        # Play — это приложение с выдуманными товарами под нашим именем.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            {
              echo "SUPABASE_URL=$SUPABASE_URL"
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
              echo "DEMO_MODE=false"
              echo "SENTRY_DSN=$SENTRY_DSN"
              echo "DEFAULT_CITY=Астана"
              echo "DEFAULT_LAT=51.1280"
              echo "DEFAULT_LNG=71.4304"
            } > .env
            echo "→ собран .env с реальной базой"
            echo "LIVE_DB=true" >> "$GITHUB_ENV"
          else
            cp .env.example .env
            echo "→ секреты Supabase не заданы, демо-режим"
            echo "LIVE_DB=false" >> "$GITHUB_ENV"
          fi

      - name: Ключ подписи
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          KS="$RUNNER_TEMP/upload-keystore.jks"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "TRIAL=false" >> "$GITHUB_ENV"
            echo "→ ключ загрузки взят из секретов"
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -keypass "$ANDROID_KEY_PASSWORD" \
              -alias "$ANDROID_KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 30 \
              -dname "CN=KOMPLEKT probnaya sborka"
            echo "TRIAL=true" >> "$GITHUB_ENV"
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан — ПРОБНАЯ сборка с одноразовым ключом. В Google Play такой файл загружать нельзя."
          fi
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Манифест, Gradle и подпись выпуска
        run: bash tool/prepare_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Иконки из фирменного знака
        run: |
          if [ -f brand/logo.png ]; then
            dart run flutter_launcher_icons || echo "иконки пропущены"
          else
            echo "brand/logo.png нет — иконки по умолчанию"
          fi

      - name: Сборка выпуска (.aab)
        # Номер сборки (versionCode) обязан расти с каждой загрузкой в Play,
        # иначе консоль ответит «версия уже использована». Берём номер
        # запуска этой задачи — он растёт сам. Название версии (1.0.2) идёт
        # из pubspec.yaml, как и у iOS: версия правится в одном месте.
        run: |
          flutter build appbundle --release \
            --build-number="${GITHUB_RUN_NUMBER}" \
            --dart-define=BUILD_TAG="${GITHUB_SHA::7}"

      - name: Чем подписан файл
        # Отладочная подпись выглядела бы здесь как «CN=Android Debug».
        # Проверяем глазами в логе, а не узнаём от консоли Play.
        run: |
          AAB=build/app/outputs/bundle/release/app-release.aab
          ls -lh "$AAB"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|Владелец|Valid|SHA256" || true
          if keytool -printcert -jarfile "$AAB" | grep -q "Android Debug"; then
            echo "::error::Выпуск подписан отладочным ключом — подпись не подставилась."
            exit 1
          fi

      - name: Итог
        run: |
          {
            echo "## Сборка для Google Play"
            echo ""
            echo "- версия: $(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d+ -f1), номер сборки ${GITHUB_RUN_NUMBER}"
            if [ "$TRIAL" = "true" ]; then
              echo "- **ПРОБНАЯ сборка**: подписана одноразовым ключом, в Play загружать нельзя"
            else
              echo "- подписана ключом загрузки из секретов — годится для Play Console"
            fi
            if [ "$LIVE_DB" != "true" ]; then
              echo "- **демо-режим**: секреты Supabase не заданы, в магазин такую сборку отправлять нельзя"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Файл для загрузки в Play Console
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TRIAL == 'true' && 'komplekt-PROBNAYA-ne-dlya-play' || 'komplekt-play-aab' }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

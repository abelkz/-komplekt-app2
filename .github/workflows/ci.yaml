name: CI & Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare .env (demo)
        run: cp .env.example .env

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Patch Android config
        run: |
          F=android/app/build.gradle.kts
          sed -i '/compileOptions {/a\        isCoreLibraryDesugaringEnabled = true' "$F"
          sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' "$F"
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/' "$F"
          printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> "$F"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze
        continue-on-error: true

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: komplekt-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

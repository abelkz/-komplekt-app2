name: CI & Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # чтобы выложить APK в релиз

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare .env
        # Есть секреты Supabase — собираем APK с реальной базой,
        # нет — остаёмся в демо-режиме, чтобы сборка не падала.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            {
              echo "SUPABASE_URL=$SUPABASE_URL"
              echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
              echo "DEMO_MODE=false"
              echo "SENTRY_DSN=$SENTRY_DSN"
              echo "DEFAULT_CITY=Астана"
              echo "DEFAULT_LAT=51.1280"
              echo "DEFAULT_LNG=71.4304"
            } > .env
            echo "→ собран .env с реальной базой"
          else
            cp .env.example .env
            echo "→ секреты не заданы, демо-режим"
          fi

      - name: Generate platform folders
        run: flutter create . --platforms=android

      - name: Манифест и Gradle
        # Общий скрипт с выпуском для Google Play (play.yaml): разрешения,
        # идентификатор и версии SDK обязаны совпадать в обеих сборках.
        run: bash tool/prepare_android.sh

      - name: Install dependencies
        run: flutter pub get

      - name: Иконки из фирменного знака
        # Здесь есть только android/ — веб-часть конфига пропускается сама.
        # Ошибку не считаем фатальной: APK важнее иконки.
        run: |
          if [ -f brand/logo.png ]; then
            dart run flutter_launcher_icons || echo "иконки пропущены"
          else
            echo "brand/logo.png нет — иконки по умолчанию"
          fi

      - name: Analyze
        # Гейт: падаем на ОШИБКАХ (сломанная сборка), но не на стилевых
        # замечаниях — так ловим забытые импорты/скобки до сборки.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        # Гейт: падающий тест блокирует сборку — денежная логика и вход
        # под присмотром.
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug --dart-define=BUILD_TAG="${GITHUB_SHA::7}"

      - name: В сборке есть файл настроек
        run: bash tool/check_env_bundled.sh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: komplekt-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Готовим файл APK с понятным именем
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: cp build/app/outputs/flutter-apk/app-debug.apk komplekt.apk

      # Постоянная ссылка на последний APK:
      # https://github.com/abelkz/-komplekt-app2/releases/download/latest/komplekt.apk
      - name: Публикуем APK в релиз «latest»
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: КОМПЛЕКТ — последний APK
          body: "Debug-сборка для Android. Обновляется автоматически при каждом изменении. Сборка ${{ github.sha }}"
          prerelease: true
          files: komplekt.apk

# ─────────────────────────────────────────────────────────────────────────
# КОМПЛЕКТ — сборка и публикация iOS через Codemagic (без своего Мака).
#
# Что нужно один раз настроить в Codemagic (по шагам — в инструкции от Claude):
#   1. Подключить этот GitHub-репозиторий.
#   2. Добавить App Store Connect API-ключ (интеграция) и назвать её ровно:
#          komplekt_appstore
#      (Codemagic → Teams/Settings → Integrations → App Store Connect).
#   3. Создать группу переменных «supabase» со значениями:
#          SUPABASE_URL         — адрес проекта Supabase
#          SUPABASE_ANON_KEY    — публичный anon-ключ
#          SENTRY_DSN           — отчёты о падениях (необязательно: без него
#                                 сборка идёт как раньше, просто без отчётов)
#      (Codemagic → App settings → Environment variables, группа: supabase).
#   4. В App Store Connect создать приложение с Bundle ID: kz.komplekt.app
#
# После этого достаточно нажать «Start new build» — Codemagic соберёт .ipa,
# подпишет и зальёт в TestFlight. Оттуда потом отправляешь на ревью в App Store.
# ─────────────────────────────────────────────────────────────────────────

workflows:
  ios-appstore:
    name: КОМПЛЕКТ · iOS App Store
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: komplekt_appstore
    environment:
      groups:
        - supabase
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Ключи окружения (.env)
        script: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "DEMO_MODE=false"
            echo "SENTRY_DSN=$SENTRY_DSN"
            echo "DEFAULT_CITY=Астана"
            echo "DEFAULT_LAT=51.1280"
            echo "DEFAULT_LNG=71.4304"
          } > .env

      - name: Создать папку ios/
        # Папка ios/ не хранится в репозитории — генерируем её.
        script: flutter create . --platforms=ios

      - name: Настроить Info.plist (разрешения и схемы)
        script: |
          P=ios/Runner/Info.plist
          set_str() {
            /usr/libexec/PlistBuddy -c "Delete :$1" "$P" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$P"
          }
          set_str NSPhotoLibraryUsageDescription \
            "Доступ к фото нужен, чтобы прикрепить изображение товара к вашему прайсу."
          set_str NSCameraUsageDescription \
            "Доступ к камере нужен, чтобы сфотографировать товар для карточки."
          set_str NSLocationWhenInUseUsageDescription \
            "Геопозиция нужна, чтобы показать поставщиков рядом с вами на карте."
          # Плагин геолокации ссылается и на «always»-API — Apple требует
          # описание и для него (иначе предупреждение ITMS-90683).
          set_str NSLocationAlwaysAndWhenInUseUsageDescription \
            "Геопозиция нужна, чтобы показать поставщиков рядом с вами на карте."
          set_str NSLocationAlwaysUsageDescription \
            "Геопозиция нужна, чтобы показать поставщиков рядом с вами на карте."
          # Приложение использует только стандартное шифрование (HTTPS) —
          # освобождено от экспортных требований. Чтобы Apple не спрашивала
          # про шифрование при каждой загрузке в TestFlight.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$P"
          # Доставка пуша, когда приложение свёрнуто или выгружено. Без этого
          # режима система будит приложение только по тапу, а «тихие» пуши
          # (content-available) не доходят вовсе.
          #
          # Под тем же флагом, что и aps-environment: заявлять фоновый режим
          # для пушей в приложении, которое не умеет их получать, — повод
          # для вопросов на ревью Apple.
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$P" 2>/dev/null || true
          if [ "$PUSH_READY" = "1" ]; then
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$P"
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string remote-notification" "$P"
          fi
          /usr/libexec/PlistBuddy -c "Delete :LSApplicationQueriesSchemes" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes array" "$P"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:0 string tel" "$P"
          /usr/libexec/PlistBuddy -c "Add :LSApplicationQueriesSchemes:1 string whatsapp" "$P"
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$P" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleTypeRole string Editor" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$P"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string kz.komplekt.app" "$P"

      - name: iOS deployment target 15.0
        # Было 13.0. Поднято вместе с firebase_core 4.x: он тянет Firebase
        # iOS SDK 12.x, которому нужен минимум iOS 15.0, и с 13.0 падает
        # уже `pod install`. Пользователей это не задевает: собранные
        # приложения и так уезжали с «Min OS version: 15.0» — планку
        # поднимал кто-то из подов, просто молча.
        script: |
          if grep -q "^# *platform :ios" ios/Podfile; then
            sed -i '' "s/^# *platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          elif ! grep -q "^platform :ios" ios/Podfile; then
            printf "platform :ios, '15.0'\n%s\n" "$(cat ios/Podfile)" > ios/Podfile
          else
            sed -i '' "s/^platform :ios.*/platform :ios, '15.0'/" ios/Podfile
          fi
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = 1[0-4]\.[0-9]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Зафиксировать Bundle ID и только iPhone
        # Фиксируем идентификатор и делаем приложение только для iPhone
        # (TARGETED_DEVICE_FAMILY = 1) — тогда App Store не требует
        # отдельных скриншотов для iPad.
        script: |
          sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = kz.komplekt.app;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          sed -i '' -E 's/TARGETED_DEVICE_FAMILY = "?1,2"?;/TARGETED_DEVICE_FAMILY = "1";/g' \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Entitlements — вход через Apple и пуши
        # Возможность «Sign in with Apple» требует entitlement в проекте.
        # Создаём файл и прописываем путь к нему во все конфигурации Runner.
        #
        # aps-environment без него iOS вообще не выдаёт APNs-токен,
        # FirebaseMessaging.getToken() возвращает null, и пуши молча не
        # приходят. Но добавлять его можно только после того, как у App ID
        # kz.komplekt.app в Apple Developer включена возможность Push
        # Notifications: профиль подписи выпускается по возможностям App ID,
        # и с лишним entitlement сборка падает на подписи —
        #   Provisioning profile ... doesn't include the aps-environment
        #   entitlement
        # (проверено на сборке 26, 19.09.2026).
        #
        # Поэтому флаг PUSH_READY=1 в группе переменных «supabase».
        # Ставить его вместе с настройкой Firebase, не раньше:
        # порядок — сначала возможность у App ID, потом флаг, потом сборка.
        # Подробности — в ПУШИ_И_ФУНКЦИИ.md.
        script: |
          set -e
          printf '%s' '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict></dict></plist>' > ios/Runner/Runner.entitlements
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" ios/Runner/Runner.entitlements
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" ios/Runner/Runner.entitlements
          if [ "$PUSH_READY" = "1" ]; then
            /usr/libexec/PlistBuddy -c "Add :aps-environment string production" ios/Runner/Runner.entitlements
            echo "→ aps-environment добавлен"
          else
            echo "→ PUSH_READY не задан — собираем без aps-environment (пуши на iOS работать не будут)"
          fi
          sed -i '' -E 's#(PRODUCT_BUNDLE_IDENTIFIER = kz\.komplekt\.app;)#\1 CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements;#g' \
            ios/Runner.xcodeproj/project.pbxproj

      - name: Flutter-зависимости
        script: flutter pub get

      - name: Иконка приложения из brand/logo.png
        # Папки android/ в iOS-сборке нет, поэтому свой конфиг только для iOS
        # (общий из pubspec падает на отсутствии AndroidManifest.xml).
        script: |
          printf 'flutter_launcher_icons:\n  image_path: "brand/logo.png"\n  ios: true\n  remove_alpha_ios: true\n' > ios_icons.yaml
          dart run flutter_launcher_icons -f ios_icons.yaml

      - name: Подпись — сертификат и профиль
        # Приватный ключ хранится в CERTIFICATE_PRIVATE_KEY как base64 (одна
        # строка — чтобы переносы строк не терялись). Раскодируем его в файл,
        # затем fetch-signing-files создаёт/переиспользует сертификат и профиль.
        script: |
          set -e
          keychain initialize
          echo "$CERTIFICATE_PRIVATE_KEY" | openssl base64 -d -A > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "kz.komplekt.app" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Сборка .ipa
        # Номер версии НЕ задаём флагом: Flutter берёт его из pubspec.yaml.
        # Раньше здесь было вшито --build-name=1.0.0, и при выпуске новой
        # версии про этот флаг легко забыть — App Store отклоняет загрузку
        # с уже занятым номером. Теперь версия правится в одном месте.
        # Номер сборки остаётся от Codemagic: он должен расти при каждой
        # загрузке, даже если версия та же.
        #
        # BUILD_TAG прокидываем так же, как в ci.yaml: без него метка внизу
        # профиля у ВСЕХ iOS-сборок одинаковая («local»), и отличить свежую
        # от старой нельзя — а именно для этого она и заведена (CLAUDE.md §7).
        # Поймано 19.09.2026: при разборе, почему не приходят уведомления,
        # не удалось понять, какая сборка стоит на телефоне.
        script: |
          flutter build ipa --release \
            --build-number=$(($BUILD_NUMBER)) \
            --dart-define=BUILD_TAG="$BUILD_NUMBER-${CM_COMMIT:0:7}" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Права подписанного приложения в лог
        # Печатает то, что реально вшито в бинарник, а не то, что мы просили
        # вшить. Оставлено насовсем: разбор поломки пушей (сборки 26–37)
        # три раза упирался в вопрос «а точно ли aps-environment доехал»,
        # и ответа не было нигде — файл Runner.entitlements его не даёт.
        # Строчка в логе стоит секунды и снимает целый класс догадок.
        script: |
          APP=$(ls -d build/ios/archive/Runner.xcarchive/Products/Applications/*.app 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            codesign -d --entitlements :- "$APP" 2>&1 || true
          else
            echo "архив не найден — пропускаем"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Загружаем в TestFlight. На ревью в App Store отправишь потом вручную
        # из App Store Connect (когда заполнишь описание и скриншоты).
        submit_to_testflight: true
